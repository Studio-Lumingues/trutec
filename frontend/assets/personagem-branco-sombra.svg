<svg viewBox="0 0 500 500" width="500" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"  xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- tremidinha de lápis: distorce as bordas como se fosse desenhado à mão -->
    <filter id="mao-a" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mao-b" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="17" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="mao-c" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pescoco-sombra" x="-60%" y="-150%" width="220%" height="400%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="clip-corpo"><ellipse cx="250" cy="526.85" rx="162.3" ry="247.2"/></clipPath>
    <clipPath id="clip-carta"><rect x="151.5" y="41.5" width="196.5" height="254.5" rx="16" ry="16"/></clipPath>
  </defs>

  <!-- ===== CORPO ===== -->
  <!-- preenchimento levemente "fora do risco", como tinta passada sem cuidado -->
  <g filter="url(#mao-a)">
    <ellipse cx="253" cy="530" rx="162.3" ry="247.2" fill="#ffffff"/>
  </g>
  <!-- hachuras (riscos de sombra) -->
  <g clip-path="url(#clip-corpo)" filter="url(#mao-c)" stroke="#8f8f8f" stroke-width="3" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M110 330 L150 300 M105 360 L165 318 M102 390 L178 336 M100 420 L190 356 M100 450 L200 378 M100 480 L212 400"/>
    <path d="M385 330 L350 302 M392 362 L338 322 M396 394 L326 342"/>
  </g>
  <!-- contorno duplo (traço refeito) -->
  <g filter="url(#mao-b)" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="250" cy="526.85" rx="162.3" ry="247.2" stroke-width="5.5"/>
  </g>
  <g filter="url(#mao-c)" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <ellipse cx="247" cy="524" rx="163" ry="248" stroke-width="2.5"/>
  </g>

  <!-- sombra do pescoço -->
  <ellipse cx="250" cy="312" rx="80" ry="14" fill="#6a6a6a" opacity="0.7" filter="url(#pescoco-sombra)"/>
  <g clip-path="url(#clip-corpo)" filter="url(#mao-c)" stroke="#4a4a4a" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M180 308 L196 322 M198 306 L214 322 M216 306 L232 322 M234 306 L250 322 M252 306 L268 322 M270 306 L286 322 M288 306 L304 322"/>
  </g>

  <!-- ===== CARTA / CABEÇA ===== -->
  <g filter="url(#mao-a)">
    <rect x="149" y="45" width="196.5" height="254.5" rx="16" ry="16" fill="#ffffff"/>
  </g>
  <g clip-path="url(#clip-carta)" filter="url(#mao-c)" stroke="#d6d6d6" stroke-width="3" stroke-linecap="round" opacity="0.6" fill="none">
    <path d="M170 90 L200 62 M170 125 L226 66 M170 160 L246 76"/>
  </g>
  <g clip-path="url(#clip-carta)" filter="url(#mao-c)" stroke="#8f8f8f" stroke-width="3" stroke-linecap="round" opacity="0.45" fill="none">
    <path d="M334 210 L292 288 M334 240 L312 288 M334 180 L270 288"/>
  </g>
  <g filter="url(#mao-b)" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round">
    <rect x="151.5" y="41.5" width="196.5" height="254.5" rx="16" ry="16" stroke-width="5.5"/>
  </g>
  <g filter="url(#mao-a)" fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <rect x="154" y="44" width="194" height="252" rx="16" ry="16" stroke-width="2.5"/>
  </g>

  <!-- sombra projetada pelo boneco de cima (mancha + hachuras) -->
  <defs>
    <linearGradient id="sombra-g" x1="0" y1="100" x2="0" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a1a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1a1a1a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip-carta)" filter="url(#mao-c)">
    <rect x="140" y="98" width="220" height="120" fill="url(#sombra-g)"/>
  </g>
  <g clip-path="url(#clip-carta)" filter="url(#mao-c)" stroke="#2a2a2a" stroke-width="3" stroke-linecap="round" fill="none">
    <path opacity="0.62" d="M150 119 L161 106 M165 119 L176 106 M180 119 L191 106 M195 119 L206 106 M210 119 L221 106 M225 119 L236 106 M240 119 L251 106 M255 119 L266 106 M270 119 L281 106 M285 119 L296 106 M300 119 L311 106 M315 119 L326 106 M330 119 L341 106 M345 119 L356 106"/>
    <path opacity="0.51" d="M150 136 L161 123 M165 136 L176 123 M180 136 L191 123 M195 136 L206 123 M210 136 L221 123 M225 136 L236 123 M240 136 L251 123 M255 136 L266 123 M270 136 L281 123 M285 136 L296 123 M300 136 L311 123 M315 136 L326 123 M330 136 L341 123 M345 136 L356 123"/>
    <path opacity="0.40" d="M150 153 L161 140 M172 153 L183 140 M194 153 L205 140 M216 153 L227 140 M238 153 L249 140 M260 153 L271 140 M282 153 L293 140 M304 153 L315 140 M326 153 L337 140 M348 153 L359 140"/>
    <path opacity="0.29" d="M150 170 L161 157 M172 170 L183 157 M194 170 L205 157 M216 170 L227 157 M238 170 L249 157 M260 170 L271 157 M282 170 L293 157 M304 170 L315 157 M326 170 L337 157 M348 170 L359 157"/>
    <path opacity="0.18" d="M150 187 L161 174 M172 187 L183 174 M194 187 L205 174 M216 187 L227 174 M238 187 L249 174 M260 187 L271 174 M282 187 L293 174 M304 187 L315 174 M326 187 L337 174 M348 187 L359 174"/>
  </g>
</svg>
